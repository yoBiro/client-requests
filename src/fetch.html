<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Usuários - FakeStore API</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    header p {
      color: #cbd5e1;
      font-size: 1rem;
    }

    .status {
      text-align: center;
      margin-bottom: 25px;
      color: #cbd5e1;
    }

    .users-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .user-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 24px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .user-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    }

    .user-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      font-size: 1.4rem;
      font-weight: bold;
      flex-shrink: 0;
    }

    .user-name {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .username {
      color: #a5b4fc;
      font-size: 0.9rem;
    }

    .info {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: #e2e8f0;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .icon {
      width: 20px;
      text-align: center;
    }

    .error {
      text-align: center;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fecaca;
      padding: 20px;
      border-radius: 12px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #cbd5e1;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      body {
        padding: 25px 15px;
      }

      header h1 {
        font-size: 2rem;
      }

      .users-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>👥 Lista de Usuários</h1>
      <p>Dados carregados através da FakeStore API</p>
    </header>

    <div id="status" class="status">
      Carregando usuários...
    </div>

    <div id="users" class="users-grid">
      <div class="loading">
        <div class="spinner"></div>
        Buscando usuários...
      </div>
    </div>

    <footer>
      FakeStore API • 20 usuários
    </footer>

  </div>

  <script>
    const API_URL = "https://fakestoreapi.com/users";

    const usersContainer = document.getElementById("users");
    const status = document.getElementById("status");

    function criarAvatar(nome, sobrenome) {
      return `${nome.charAt(0)}${sobrenome.charAt(0)}`.toUpperCase();
    }

    function criarCard(usuario) {
      const {
        name,
        username,
        email,
        phone,
        address,
        id
      } = usuario;

      const nomeCompleto = `${name.firstname} ${name.lastname}`;

      return `
        <article class="user-card">

          <div class="user-header">
            <div class="avatar">
              ${criarAvatar(name.firstname, name.lastname)}
            </div>

            <div>
              <div class="user-name">
                ${nomeCompleto}
              </div>

              <div class="username">
                @${username}
              </div>
            </div>
          </div>

          <div class="info">

            <div class="info-item">
              <span class="icon">📧</span>
              <span>${email}</span>
            </div>

            <div class="info-item">
              <span class="icon">📱</span>
              <span>${phone}</span>
            </div>

            <div class="info-item">
              <span class="icon">📍</span>
              <span>
                ${address.city}, ${address.street}, ${address.number}
              </span>
            </div>

            <div class="info-item">
              <span class="icon">🌎</span>
              <span>${address.zipcode}</span>
            </div>

            <div class="info-item">
              <span class="icon">🆔</span>
              <span>Usuário #${id}</span>
            </div>

          </div>

        </article>
      `;
    }

    async function carregarUsuarios() {
      try {
        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error("Erro ao buscar os usuários.");
        }

        const usuarios = await response.json();

        // Garante que sejam exibidos no máximo 20 usuários
        const primeiros20 = usuarios.slice(0, 20);

        usersContainer.innerHTML = primeiros20
          .map(criarCard)
          .join("");

        status.textContent =
          `${primeiros20.length} usuários carregados com sucesso.`;

      } catch (error) {
        console.error(error);

        usersContainer.innerHTML = `
          <div class="error">
            <h2>⚠️ Não foi possível carregar os usuários</h2>
            <p>Verifique sua conexão e tente novamente.</p>
          </div>
        `;

        status.textContent = "";
      }
    }

    carregarUsuarios();
  </script>

</body>
</html>
